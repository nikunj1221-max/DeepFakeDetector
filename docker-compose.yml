version: '3.9'

services:

  # ── FastAPI + PyTorch backend ─────────────────────────────────────────
  backend:
    build: ./backend
    container_name: deepguard-api
    ports:
      - '8000:8000'
    environment:
      # Uncomment and set to load fine-tuned weights inside the container:
      # MODEL_PATH: /app/models/deepguard_efficientnet_b0.pth
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      # Mount your local models/ folder so you can hot-swap checkpoint files
      - ./backend/models:/app/models:ro
    restart: unless-stopped

  # ── React / Vite frontend ─────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: deepguard-ui
    working_dir: /app
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    restart: unless-stopped
