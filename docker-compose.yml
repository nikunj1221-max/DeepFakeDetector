version: '3.9'

services:

  # ── FastAPI + PyTorch backend ─────────────────────────────────────────
  backend:
    build: ./deepfake-detector-api
    container_name: deepguard-api
    ports:
      - '8000:8000'
    environment:
      # Uncomment and set to load fine-tuned weights inside the container:
      # MODEL_PATH: /app/models/deepguard_efficientnet_b0.pth
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      # Mount your local models/ folder so you can hot-swap checkpoint files
      - ./deepfake-detector-api/models:/app/models:ro
    restart: unless-stopped

  # ── React static frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deepguard-ui
    ports:
      - '80:80'
    environment:
      # In production this is mostly handled by nginx reverse proxy.
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
